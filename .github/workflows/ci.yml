# Continuous integration: the full test suite, validation and evals on Windows, Linux and macOS.
# No Node.js/Playwright is installed: this also proves the runtime dependency is optional.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests
      - name: Skill validation
        run: python plugins/ui-engineering/scripts/validate_skill.py
      - name: Knowledge catalogs and registry
        run: python plugins/ui-engineering/scripts/knowledge_lib.py check
      - name: Packaging boundary
        run: python plugins/ui-engineering/packaging/package_files.py
      - name: Automated evals
        run: python plugins/ui-engineering/scripts/uiux_cli.py call run_evals
